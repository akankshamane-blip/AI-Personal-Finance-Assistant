<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FinMate AI - Budget</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .budget-container {
            padding: 30px;
        }

        .budget-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-bottom: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .budget-box h2 {
            margin-bottom: 10px;
        }

        .budget-form {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .budget-form input {
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            width: 250px;
        }

        .budget-form button {
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background: #6c63ff;
            color: white;
            font-size: 16px;
        }

        .budget-form button:hover {
            opacity: 0.9;
        }

        .budget-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .budget-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .budget-card h3 {
            margin-bottom: 10px;
            color: #666;
        }

        .budget-card p {
            font-size: 25px;
            font-weight: bold;
        }

        .progress-box {
            background: white;
            padding: 25px;
            border-radius: 15px;
            margin-top: 25px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.08);
        }

        .progress-bar {
            width: 100%;
            height: 18px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
            margin-top: 15px;
        }

        #progressFill {
            height: 100%;
            width: 0%;
            background: #6c63ff;
            transition: width 0.4s;
        }

        #budgetMessage {
            margin-top: 15px;
            font-weight: 600;
        }

        @media (max-width: 800px) {
            .budget-cards {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

    <div class="budget-container">

        <h1>Budget</h1>
        <p>Set and manage your monthly budget with FinMate AI.</p>

        <div class="budget-box">
            <h2>Set Monthly Budget</h2>

            <form id="budgetForm" class="budget-form">

                <input
                    type="number"
                    id="budgetAmount"
                    placeholder="Example: 40000"
                    min="1"
                    required
                >

                <button type="submit">
                    Save Budget
                </button>

            </form>
        </div>


        <div class="budget-cards">

            <div class="budget-card">
                <h3>Monthly Budget</h3>
                <p id="totalBudget">₹0</p>
            </div>

            <div class="budget-card">
                <h3>Total Spent</h3>
                <p id="totalSpent">₹0</p>
            </div>

            <div class="budget-card">
                <h3>Remaining</h3>
                <p id="remainingBudget">₹0</p>
            </div>

        </div>


        <div class="progress-box">

            <h2>Budget Usage</h2>

            <div class="progress-bar">
                <div id="progressFill"></div>
            </div>

            <p id="budgetMessage">
                Set your monthly budget to start tracking.
            </p>

        </div>

    </div>


<script>

const budgetForm = document.getElementById("budgetForm");


// ======================================
// LOAD CURRENT EXPENSES
// ======================================

async function getExpenses() {

    const user = JSON.parse(localStorage.getItem("loggedInUser"));

    if (!user) {
        console.log("No logged-in user found.");
        return 0;
    }

    try {

        const response = await fetch(
            `http://127.0.0.1:5000/api/expenses/${user.user_id}`
        );

        const data = await response.json();

        let totalExpenses = 0;

        if (data.expenses) {

            data.expenses.forEach(function(item) {

                totalExpenses += Number(item.amount);

            });

        }

        return totalExpenses;

    } catch (error) {

        console.error("Expense loading error:", error);

        return 0;
    }
}


// ======================================
// DISPLAY BUDGET
// ======================================

async function updateBudgetDisplay() {

    const budget = Number(
        localStorage.getItem("monthlyBudget") || 0
    );

    const spent = await getExpenses();

    const remaining = budget - spent;

    document.getElementById("totalBudget").textContent =
        "₹" + budget.toLocaleString("en-IN");

    document.getElementById("totalSpent").textContent =
        "₹" + spent.toLocaleString("en-IN");

    document.getElementById("remainingBudget").textContent =
        "₹" + remaining.toLocaleString("en-IN");


    let percentage = 0;

    if (budget > 0) {

        percentage = (spent / budget) * 100;

        if (percentage > 100) {
            percentage = 100;
        }

    }

    document.getElementById("progressFill").style.width =
        percentage + "%";


    const message =
        document.getElementById("budgetMessage");


    if (budget === 0) {

        message.textContent =
            "Set your monthly budget to start tracking.";

    }
    else if (spent > budget) {

        message.textContent =
            "⚠️ You have exceeded your monthly budget.";

    }
    else if (spent >= budget * 0.8) {

        message.textContent =
            "⚠️ You are close to your monthly budget.";

    }
    else {

        message.textContent =
            "✅ You are within your monthly budget.";

    }

}


// ======================================
// SAVE BUDGET TO BACKEND
// ======================================

budgetForm.addEventListener("submit", async function(event) {

    event.preventDefault();

    const amount =
        Number(document.getElementById("budgetAmount").value);

    const user =
        JSON.parse(localStorage.getItem("loggedInUser"));


    if (!user) {

        alert("Please login first.");

        return;
    }


    if (!amount || amount <= 0) {

        alert("Please enter a valid budget amount.");

        return;
    }


    const today = new Date();

    const month =
        today.getFullYear() +
        "-" +
        String(today.getMonth() + 1).padStart(2, "0");


    try {

        const response = await fetch(
            "http://127.0.0.1:5000/api/budget",
            {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({

                    user_id: user.user_id,

                    amount: amount,

                    month_year: month

                })
            }
        );


        const data = await response.json();


        if (response.ok) {

            localStorage.setItem(
                "monthlyBudget",
                amount
            );

            alert("Budget saved successfully!");

            document.getElementById("budgetAmount").value = "";

            updateBudgetDisplay();

        }
        else {

            alert(
                "Error: " +
                (data.message || "Unable to save budget.")
            );

        }

    }
    catch (error) {

        console.error(error);

        alert(
            "Backend connection failed. Make sure Flask is running."
        );

    }

});


// ======================================
// START
// ======================================

updateBudgetDisplay();

</script>

</body>
</html>
